plugins { id 'com.android.application' }
android {
    namespace 'app.uab.bridge'
    compileSdk 34
    defaultConfig {
        applicationId 'app.uab.puente2'
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName '0.10.1'
    }
    // Si existe uab.keystore (en la raíz), todas las compilaciones se firman con la MISMA llave:
    // así Android actualiza la app encima de la anterior y conserva cookies y ajustes.
    def ks = rootProject.file('uab.keystore')   // la llave está en la raíz del repositorio
    if (ks.exists()) {
        signingConfigs {
            debug {
                storeFile ks
                storePassword 'uabkey'
                keyAlias 'uab'
                keyPassword 'uabkey'
            }
        }
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    // Permite varias cuentas de la misma IA (perfiles de WebView)
    implementation 'androidx.webkit:webkit:1.12.1'
}
