plugins { id 'com.android.application' }
android {
    namespace 'app.uab.bridge'
    compileSdk 34
    defaultConfig {
        applicationId 'app.uab.puente2'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '0.6.0'
    }
    // Si existe app/uab.keystore, todas las compilaciones se firman con la MISMA llave:
    // así Android actualiza la app encima de la anterior y conserva cookies y ajustes.
    def ks = file('uab.keystore')
    if (ks.exists()) {
        signingConfigs {
            debug {
                storeFile ks
                storePassword 'uabkey'
                keyAlias 'uab'
                keyPassword 'uabkey'
            }
        }
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    // Permite varias cuentas de la misma IA (perfiles de WebView)
    implementation 'androidx.webkit:webkit:1.12.1'
}
