name: Compilar UAB
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --no-daemon
      - name: Publicar el APK como descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk uab-2.apk
          gh release create "v2-${GITHUB_RUN_NUMBER}" uab-2.apk --title "UAB 2 (compilación ${GITHUB_RUN_NUMBER})" --notes "Se instala aparte de la app vieja (nombre UAB 2)."
