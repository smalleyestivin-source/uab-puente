name: Compilar UAB
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --no-daemon
      - name: Publicar el APK como descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -o "versionName '[^']*'" app/build.gradle | cut -d"'" -f2)
          cp app/build/outputs/apk/debug/app-debug.apk "UAB-v${V}.apk"
          gh release create "v${V}-${GITHUB_RUN_NUMBER}" "UAB-v${V}.apk" --title "UAB versión ${V}" --notes "App UAB 2, versión ${V}. Se instala sobre la anterior."
